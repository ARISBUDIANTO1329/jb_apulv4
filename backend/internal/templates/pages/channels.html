{{define "content"}}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-xl font-semibold text-gray-900">Channels</h1>
        <button onclick="document.getElementById('modal-add').classList.remove('hidden')" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700">+ Tambah Channel</button>
    </div>

    <div id="channels-list" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
</div>

<div id="modal-add" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="this.parentElement.classList.add('hidden')"></div>
    <div class="relative max-w-md mx-auto mt-20 bg-white rounded-xl shadow-xl p-6">
        <h2 class="text-lg font-semibold mb-4">Tambah Channel</h2>
        <div class="space-y-3">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Nama Channel *</label>
                <input id="ch-name" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Nama channel">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Niche</label>
                <input id="ch-niche" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Music, Gaming, dll">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">YouTube Channel ID</label>
                <input id="ch-youtube-id" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="UC...">
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
            <button onclick="this.closest('#modal-add').classList.add('hidden')" class="px-4 py-2 text-sm text-gray-600">Batal</button>
            <button onclick="addChannel()" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700">Tambah</button>
        </div>
    </div>
</div>

<script>
const COLORS = ['#6366f1','#ec4899','#14b8a6','#f97316','#84cc16','#06b6d4','#a855f7','#ef4444','#22c55e','#eab308'];

function fmt(n) {
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n/1000).toFixed(1) + 'K';
    return n;
}

function fmtDate(d) {
    if (!d) return '-';
    return new Date(d).toLocaleDateString('id-ID', {day:'numeric',month:'short',year:'numeric'});
}

async function loadChannels() {
    const r = await fetch('/api/channels');
    const channels = await r.json();
    const c = document.getElementById('channels-list');
    if (!channels.length) {
        c.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400">Belum ada channel. Klik "+ Tambah Channel" untuk memulai.</div>';
        return;
    }
    c.innerHTML = channels.map((ch,i) => {
        const color = COLORS[i % COLORS.length];
        const ini = (ch.name||'??').substring(0,2).toUpperCase();
        const tokenColor = ch.token_status === 'valid' ? 'green' : ch.token_status === 'expired' ? 'red' : 'yellow';
        return `<div class="bg-white shadow rounded-lg p-4 border-l-4" style="border-color:${color}">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div style="width:40px;height:40px;border-radius:10px;background:${color}20;display:flex;align-items:center;justify-content:center;font-weight:900;color:${color}">${ini}</div>
                    <div>
                        <div class="font-bold text-gray-900">${ch.name}</div>
                        <div class="text-xs text-gray-500">#${ch.id} • ${ch.niche||'-'}</div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-${tokenColor}-100 text-${tokenColor}-800">${ch.token_status||'unknown'}</span>
                    <button onclick="deleteChannel('${ch.id}')" class="text-red-400 hover:text-red-600 text-sm">✕</button>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mb-3">
                <div class="text-center p-2 rounded bg-gray-50">
                    <div class="text-xs text-gray-500">Subs</div>
                    <div class="font-bold text-gray-900">${fmt(ch.subscriber_count)}</div>
                </div>
                <div class="text-center p-2 rounded bg-gray-50">
                    <div class="text-xs text-gray-500">Views</div>
                    <div class="font-bold text-gray-900">${fmt(ch.total_views)}</div>
                </div>
                <div class="text-center p-2 rounded bg-gray-50">
                    <div class="text-xs text-gray-500">Videos</div>
                    <div class="font-bold text-gray-900">${ch.video_count}</div>
                </div>
            </div>
            <div class="flex items-center justify-between text-xs text-gray-500">
                <span>Stream key: ${ch.stream_key ? '✅ Ada' : '❌ Belum'}</span>
                <span>Last upload: ${fmtDate(ch.last_upload)}</span>
            </div>
            <div class="flex items-center gap-2 mt-3">
                <a href="/api/channels/${ch.id}/connect" class="px-3 py-1 text-xs bg-blue-50 text-blue-700 rounded hover:bg-blue-100">Connect Google</a>
                <button onclick="checkToken('${ch.id}')" class="px-3 py-1 text-xs bg-gray-100 text-gray-600 rounded hover:bg-gray-200">Check Token</button>
            </div>
        </div>`;
    }).join('');
}

async function addChannel() {
    const name = document.getElementById('ch-name').value.trim();
    if (!name) { alert('Nama wajib diisi'); return; }
    await fetch('/api/channels', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({name, niche: document.getElementById('ch-niche').value, youtube_channel_id: document.getElementById('ch-youtube-id').value})
    });
    document.getElementById('modal-add').classList.add('hidden');
    document.getElementById('ch-name').value = '';
    document.getElementById('ch-niche').value = '';
    document.getElementById('ch-youtube-id').value = '';
    loadChannels();
}

async function deleteChannel(id) {
    if (!confirm('Hapus channel ini? Semua data terkait akan dihapus.')) return;
    await fetch('/api/channels/' + id, {method:'DELETE'});
    loadChannels();
}

async function checkToken(id) {
    const r = await fetch('/api/channels/' + id + '/token-status');
    const d = await r.json();
    alert('Token status: ' + d.token_status);
}

document.addEventListener('DOMContentLoaded', loadChannels);
</script>
{{end}}

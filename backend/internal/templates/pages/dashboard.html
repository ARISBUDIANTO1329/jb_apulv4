{{define "content"}}
<div class="space-y-6">
    <!-- System Stats -->
    <div id="sys-stats" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white shadow rounded-lg p-4">
            <div class="text-xs text-gray-500 mb-1">CPU</div>
            <div class="text-2xl font-bold" id="cpu-val">-</div>
            <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
                <div id="cpu-bar" class="bg-green-500 h-2 rounded-full" style="width:0%"></div>
            </div>
        </div>
        <div class="bg-white shadow rounded-lg p-4">
            <div class="text-xs text-gray-500 mb-1">Memory</div>
            <div class="text-2xl font-bold" id="mem-val">-</div>
            <div class="text-xs text-gray-400" id="mem-detail"></div>
            <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
                <div id="mem-bar" class="bg-green-500 h-2 rounded-full" style="width:0%"></div>
            </div>
        </div>
        <div class="bg-white shadow rounded-lg p-4">
            <div class="text-xs text-gray-500 mb-1">Disk</div>
            <div class="text-2xl font-bold" id="disk-val">-</div>
            <div class="text-xs text-gray-400" id="disk-detail"></div>
            <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
                <div id="disk-bar" class="bg-green-500 h-2 rounded-full" style="width:0%"></div>
            </div>
        </div>
    </div>

    <!-- Token Health Warning -->
    <div id="token-warning" class="bg-red-50 border border-red-200 rounded-lg p-4 hidden">
        <div class="flex items-center gap-2 text-red-600 text-sm">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
            </svg>
            <span id="token-message"></span>
        </div>
    </div>

    <!-- Channel Cards -->
    <div class="flex items-center justify-between">
        <h1 class="text-xl font-semibold text-gray-900">Channels</h1>
        <button onclick="showAddModal()" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700">
            + Tambah Channel
        </button>
    </div>

    <div id="ch-cards" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="col-span-full text-center py-12 text-gray-400">
            Loading channels...
        </div>
    </div>
</div>

<!-- Add Channel Modal -->
<div id="modal-add" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black bg-opacity-50" onclick="hideModal('modal-add')"></div>
    <div class="relative max-w-md mx-auto mt-20 bg-white rounded-xl shadow-xl p-6">
        <h2 class="text-lg font-semibold mb-4">Tambah Channel</h2>
        <div class="space-y-3">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Nama Channel *</label>
                <input id="new-name" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Nama channel">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Niche</label>
                <input id="new-niche" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="Music, Gaming, etc">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">YouTube Channel ID</label>
                <input id="new-youtube-id" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="UC...">
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
            <button onclick="hideModal('modal-add')" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Batal</button>
            <button onclick="addChannel()" class="px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700">✨ Tambah</button>
        </div>
    </div>
</div>

<script>
const COLORS = ['#6366f1','#ec4899','#14b8a6','#f97316','#84cc16','#06b6d4','#a855f7','#ef4444','#22c55e','#eab308'];

function fmt(n) {
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n/1000).toFixed(1) + 'K';
    return n;
}

function fmtDate(d) {
    if (!d) return '-';
    return new Date(d).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
}

function tokenBadgeClass(status) {
    const s = (status || '').toLowerCase();
    if (s === 'valid') return 'bg-green-100 text-green-800';
    if (s === 'expired' || s === 'expiring_soon') return 'bg-yellow-100 text-yellow-800';
    if (s === 'error') return 'bg-red-100 text-red-800';
    return 'bg-gray-100 text-gray-800';
}

function tokenLabel(statusOrObj) {
    const s = (typeof statusOrObj === 'string' ? statusOrObj : statusOrObj.token_status || '').toLowerCase();
    if (s === 'valid') return '✅ Token valid';
    if (s === 'expired') return '⚠️ Token expired';
    if (s === 'expiring_soon') return '⚠️ Token expiring soon';
    if (s === 'error') return '❌ Token error';
    return '🔵 Not connected';
}

function progressColor(p) {
    if (p <= 50) return 'bg-green-500';
    if (p <= 80) return 'bg-yellow-500';
    return 'bg-red-500';
}

// System Stats
async function loadStats() {
    try {
        const r = await fetch('/api/system/stats');
        const d = await r.json();
        document.getElementById('cpu-val').textContent = d.cpu_percent + '%';
        document.getElementById('cpu-bar').style.width = d.cpu_percent + '%';
        document.getElementById('cpu-bar').className = 'h-2 rounded-full ' + progressColor(d.cpu_percent);

        document.getElementById('mem-val').textContent = d.memory.percent + '%';
        document.getElementById('mem-detail').textContent = d.memory.used_mb + 'MB / ' + d.memory.total_mb + 'MB';
        document.getElementById('mem-bar').style.width = d.memory.percent + '%';
        document.getElementById('mem-bar').className = 'h-2 rounded-full ' + progressColor(d.memory.percent);

        document.getElementById('disk-val').textContent = d.disk.percent + '%';
        document.getElementById('disk-detail').textContent = d.disk.used + ' / ' + d.disk.total;
        document.getElementById('disk-bar').style.width = d.disk.percent + '%';
        document.getElementById('disk-bar').className = 'h-2 rounded-full ' + progressColor(d.disk.percent);
    } catch(e) {}
}

// Token Health
async function loadTokenHealth() {
    try {
        const r = await fetch('/api/channels/token-health');
        const data = await r.json();
        const anyError = data.some && data.some(t => t.token_status !== 'valid');
        const warn = document.getElementById('token-warning');
        const msg = document.getElementById('token-message');
        if (anyError) {
            const errors = data.filter(t => t.token_status !== 'valid').map(t => t.name + ' (' + t.token_status + ')');
            msg.textContent = 'Token issues: ' + errors.join(', ');
            warn.classList.remove('hidden');
        } else {
            warn.classList.add('hidden');
        }
    } catch(e) {}
}

// Channels - SSR data from Go template
const SSR_CHANNELS = {{.ChannelsJSON | safeHTML}};

// Channels - instant render from SSR
function loadChannels() {
    try {
        const channels = typeof SSR_CHANNELS === 'string' ? JSON.parse(SSR_CHANNELS) : SSR_CHANNELS;
        if (channels && channels.length > 0) {
            renderChannels(channels);
            return;
        }
        fetch('/api/channels').then(r => r.json()).then(renderChannels);
    } catch(e) { console.error(e); }
}

function renderChannels(channels) {
    const container = document.getElementById('ch-cards');
    if (!channels.length) {
        container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400">Belum ada channel<br><span class="text-sm">Klik "+ Tambah Channel" untuk memulai</span></div>';
        return;
    }
    container.innerHTML = channels.map((ch, i) => {
        const color = COLORS[i % COLORS.length];
        const initial = (ch.Name || ch.name || '??').substring(0, 2).toUpperCase();
        const id = ch.ID || ch.id;
        const name = ch.Name || ch.name;
        const niche = ch.Niche || ch.niche;
        const tokenStatus = ch.TokenStatus || ch.token_status;
        const streamKey = ch.StreamKey || ch.stream_key;
        const subs = ch.SubscriberCount || ch.subscriber_count || 0;
        const views = ch.TotalViews || ch.total_views || 0;
        const videos = ch.VideoCount || ch.video_count || 0;
        const lastUpload = ch.LastUpload || ch.last_upload;
        const lastLive = ch.LastLivestream || ch.last_livestream;
        return `<div class="bg-white shadow rounded-lg p-4 border-l-4" style="border-color:${color}">
            <div class="flex items-center gap-3 mb-3">
                <div style="width:40px;height:40px;border-radius:10px;background:${color}20;display:flex;align-items:center;justify-content:center;font-weight:900;color:${color}">${initial}</div>
                <div>
                    <div class="font-bold text-gray-900">${name}</div>
                    <div class="text-xs text-gray-500">#${id} • ${niche || '-'}</div>
                    <div class="text-xs text-gray-400">Token: ${tokenStatus || 'not connected'}</div>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mb-3">
                <div class="text-center p-2 rounded bg-gray-50">
                    <div class="text-xs text-gray-500">Subs</div>
                    <div class="font-bold text-gray-900">${fmt(subs)}</div>
                </div>
                <div class="text-center p-2 rounded bg-gray-50">
                    <div class="text-xs text-gray-500">Views</div>
                    <div class="font-bold text-gray-900">${fmt(views)}</div>
                </div>
                <div class="text-center p-2 rounded bg-gray-50">
                    <div class="text-xs text-gray-500">Videos</div>
                    <div class="font-bold text-gray-900">${videos}</div>
                </div>
            </div>
            <div class="flex items-center justify-between text-xs text-gray-500 mb-3">
                <span>Stream key: ${streamKey ? '✅ Ada' : '❌ Belum'}</span>
                <span>Last upload: ${fmtDate(lastUpload)}</span>
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${tokenBadgeClass(tokenStatus)}">
                        ${tokenLabel(tokenStatus)}
                    </span>
                </div>
                <div class="flex items-center gap-2">
                    ${tokenStatus !== 'valid' ? `<a href="/api/channels/${id}/connect" class="px-3 py-1 text-xs bg-blue-50 text-blue-700 rounded hover:bg-blue-100">🔄 Reconnect Google</a>` : ''}
                </div>
            </div>
        </div>`;
    }).join('');
}

// Add Channel
async function addChannel() {
    const name = document.getElementById('new-name').value.trim();
    if (!name) { alert('Nama channel wajib diisi'); return; }
    try {
        await fetch('/api/channels', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                name: name,
                niche: document.getElementById('new-niche').value.trim(),
                youtube_channel_id: document.getElementById('new-youtube-id').value.trim()
            })
        });
        hideModal('modal-add');
        document.getElementById('new-name').value = '';
        document.getElementById('new-niche').value = '';
        document.getElementById('new-youtube-id').value = '';
        loadChannels();
    } catch(e) { alert('Gagal menambah channel'); }
}

function showAddModal() { document.getElementById('modal-add').classList.remove('hidden'); }
function hideModal(id) { document.getElementById(id).classList.add('hidden'); }

// Init
document.addEventListener('DOMContentLoaded', function() {
    loadStats();
    loadChannels();
    loadTokenHealth();
    setInterval(loadStats, 30000);
    setInterval(loadTokenHealth, 60000);
});
</script>
{{end}}
